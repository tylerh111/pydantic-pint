# ==============================================================================
# project
# ==============================================================================

[project]
site_name = "Pydantic Pint"
site_url = "https://pydantic-pint.readthedocs.io"
site_author = "Tyler Hughes"
site_description = "Pydantic validation for Pint Quantities."

copyright = "Copyright &copy; 2024-2026 Tyler Hughes"

nav = [
    "index.md",
    "usage.md",
    "documentation.md",
    "changes.md",
    "contributing.md",
    "license.md",
]

# ==============================================================================
# theme
# ==============================================================================

[project.theme]

variant = "modern"
language = "en"

features = [
    "announce.dismiss",
    "content.action.edit",
    "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.expand",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "search.share",
    "search.suggest",
    "toc.follow",
]

[project.theme.icon]
logo = "lucide/book-open"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

# ==============================================================================
# extra
# ==============================================================================

[project.extra]
generator = false

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/tylerh111/pydantic-pint/"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/pydantic-pint/"


# ==============================================================================
# plugins
# ==============================================================================

[project.plugins.mkdocstrings.handlers.python]
inventories = [
    "https://docs.python.org/3/objects.inv",
    "https://docs.pydantic.dev/latest/objects.inv",
    "https://pint.readthedocs.io/en/latest/objects.inv",
]
paths = ["src"]
[project.plugins.mkdocstrings.handlers.python.options]
annotations_path = "brief"
allow_inspection = true
docstring_section_style = "spacy"
docstring_style = "google"
filters =  ["!^__?"]
heading_level = 2
inherited_members = true
members_order = "source"
merge_init_into_class = true
separate_signature = true
show_root_heading = true
show_source = false
show_signature_annotations = false
show_symbol_type_heading = true
show_symbol_type_toc = true

# ==============================================================================
# extensions
# ==============================================================================

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.tables]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.toc.slugify]
object = "pymdownx.slugs.slugify"
kwds = { case = "lower" }
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
smart_enable = "all"
[project.markdown_extensions.pymdownx.blocks.definition]
[project.markdown_extensions.pymdownx.blocks.html]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
repo_url_shortener = true
repo_url_shorthand = true
social_url_shorthand = true
social_url_shortener = true
user = "tylerh111"
repo = "pydantic-pint"
normalize_issue_symbols = true
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
    { name = "mermaid",class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tabbed.slugify]
object = "pymdownx.slugs.slugify"
kwds = { case = "lower" }
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
